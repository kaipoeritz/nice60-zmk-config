# -----------------------------------------------------
# USB logging (original configuration)
# -----------------------------------------------------
# Uncomment to enable USB logging
# CONFIG_ZMK_USB_LOGGING=y

# -----------------------------------------------------
# Power management
# -----------------------------------------------------

# Enter idle after 30 seconds
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep after 15 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# -----------------------------------------------------
# RGB power management
# -----------------------------------------------------

# Disable existing RGB animation while idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# -----------------------------------------------------
# Planned: reactive regional RGB lighting
# -----------------------------------------------------
# 12 individually addressable WS2812B LEDs
# Illuminate the region of the pressed key
# Afterglow: 1000 milliseconds
#
# Implementation will follow in a custom ZMK module.
CONFIG_NICE60_REACTIVE_RGB=y
