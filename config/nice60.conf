# -----------------------------------------------------
# USB logging (original configuration)
# -----------------------------------------------------
# Uncomment to enable USB logging
# CONFIG_ZMK_USB_LOGGING=y

# -----------------------------------------------------
# Power management
# -----------------------------------------------------

# Enter idle after 30 seconds
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep after 15 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# -----------------------------------------------------
# RGB power management
# -----------------------------------------------------

# Disable existing RGB animation while idle
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y  # legacy ZMK underglow only

# -----------------------------------------------------
# Planned: reactive regional RGB lighting
# -----------------------------------------------------
# 12 individually addressable WS2812B LEDs
# Illuminate the region of the pressed key
# Afterglow: 1000 milliseconds
#
# Implementation will follow in a custom ZMK module.
# Legacy global animations must not compete with the regional controller.
CONFIG_ZMK_RGB_UNDERGLOW=n

# Use the existing SPI WS2812B device without the ZMK animation engine.
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Our ZMK event-based LED controller (see src/reactive_rgb.c).
CONFIG_NICE60_REACTIVE_RGB=y
CONFIG_NICE60_REACTIVE_RGB_AFTERGLOW_MS=1000
